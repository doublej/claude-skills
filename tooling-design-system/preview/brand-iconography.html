<!doctype html>
<html lang="en">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 22px; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 14px; align-items: center; }
  .icon { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .icon svg { width: 20px; height: 20px; color: var(--color-fg); }
  .icon span { font-family: var(--font-mono); font-size: 10px; color: var(--color-muted); }
  .lbl { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 12px; }
  .note { font-size: 11px; color: var(--color-muted); margin-top: 16px; }
</style>
</head>

  <div class="lbl">Iconography · Lucide · 1.5px stroke · currentColor</div>
