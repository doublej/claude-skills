<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 0; background: var(--color-bg); }
  .topnav { display: flex; align-items: center; height: 56px; padding: 0 24px; border-bottom: 0.5px solid var(--color-border); background: var(--color-bg-elev); gap: 4px; }
  .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; margin-right: 16px; color: var(--color-fg); }
  .brand .mark { width: 20px; height: 20px; border-radius: 5px; background: var(--color-fg); display: inline-flex; align-items: center; justify-content: center; color: var(--color-bg-elev); font-family: var(--font-mono); font-size: 11px; font-weight: 600; }
  .navitem { padding: 0 10px; height: 32px; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--color-muted); border-radius: 6px; cursor: pointer; }
  .navitem:hover { background: var(--color-card-2); color: var(--color-fg); }
  .navitem[aria-current="page"] { color: var(--color-fg); background: var(--color-card-2); }
  .navitem svg { width: 12px; height: 12px; opacity: 0.6; }
  .right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .iconbtn { width: 32px; height: 32px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: var(--color-muted); cursor: pointer; }
  .iconbtn:hover { background: var(--color-card-2); color: var(--color-fg); }
  .iconbtn svg { width: 14px; height: 14px; }
  .avatar { width: 26px; height: 26px; border-radius: 999px; background: linear-gradient(135deg, #d4d4d8, #71717a); margin-left: 4px; }
  .pad { padding: 18px 24px; font-size: 12px; color: var(--color-muted); }
  .kbd { font-family: var(--font-mono); font-size: 10px; padding: 1px 5px; border: 0.5px solid var(--color-border-strong); border-radius: 4px; background: var(--color-card-2); }
</style>
</head>
<body>
  <nav class="topnav" aria-label="Primary">
    <a class="brand"><span class="mark">T</span> Tooling</a>
    <a class="navitem" aria-current="page">Overview</a>
    <a class="navitem">Accounts <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></a>
    <a class="navitem">Transactions</a>
    <a class="navitem">Holdings <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></a>
    <a class="navitem">Reports</a>
    <div class="right">
      <span class="iconbtn" title="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </span>
      <span class="kbd">⌘K</span>
      <span class="iconbtn" title="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
      </span>
      <span class="avatar"></span>
    </div>
  </nav>
  <div class="pad">Sticky TopNav · 56px · grouped dropdowns · <span style="font-family:var(--font-mono)">aria-current="page"</span> drives the active style</div>
</body>
</html>
