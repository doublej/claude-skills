<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  .sw { aspect-ratio: 1/1; border-radius: 8px; display: flex; align-items: flex-end; padding: 6px; font-family: var(--font-mono); font-size: 10px; color: #fff; }
  .lbl { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 8px; }
  .row { display: flex; align-items: center; gap: 16px; margin-top: 12px; padding-top: 12px; border-top: 0.5px solid var(--color-border); }
  .row svg { flex: none; }
</style>
</head>
<body>
  <div class="lbl">Chart palette (categorical, 8)</div>
  <div class="grid">
    <div class="sw" style="background:#5e6ad2">1</div>
    <div class="sw" style="background:#16a34a">2</div>
    <div class="sw" style="background:#d97706">3</div>
    <div class="sw" style="background:#dc2626">4</div>
    <div class="sw" style="background:#0891b2">5</div>
    <div class="sw" style="background:#7c3aed">6</div>
    <div class="sw" style="background:#db2777">7</div>
    <div class="sw" style="background:#65a30d">8</div>
  </div>
  <div class="row">
    <svg width="160" height="36" viewBox="0 0 160 36">
      <polyline points="0,28 20,22 40,26 60,14 80,16 100,8 120,12 140,4 160,6" fill="none" stroke="#5e6ad2" stroke-width="1.5"/>
      <polyline points="0,30 20,30 40,28 60,26 80,22 100,20 120,16 140,14 160,12" fill="none" stroke="#16a34a" stroke-width="1.5"/>
      <polyline points="0,18 20,20 40,16 60,22 80,18 100,24 120,20 140,22 160,18" fill="none" stroke="#d97706" stroke-width="1.5"/>
    </svg>
    <div style="font-size: 12px; color: var(--color-muted);">Holds up against both themes; use in <span style="font-family:var(--font-mono)">--chart-1..8</span></div>
  </div>
</body>
</html>
