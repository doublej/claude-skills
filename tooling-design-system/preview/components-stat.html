<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 20px; background: var(--color-bg); }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .card { background: var(--color-card); border: 0.5px solid var(--color-border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .stat-label { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-muted); font-weight: 500; }
  .stat-value { font-family: var(--font-mono); font-size: 24px; font-weight: 500; letter-spacing: -0.01em; color: var(--color-fg); font-variant-numeric: tabular-nums; }
  .stat-delta { font-size: 12px; font-weight: 500; font-family: var(--font-mono); }
  .stat-delta.pos { color: var(--color-pos); }
  .stat-delta.neg { color: var(--color-neg); }
  .stat-sub { font-size: 11px; color: var(--color-muted); }
  .row { display: flex; align-items: center; gap: 6px; }
  .spark { margin-left: auto; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <div class="row">
        <span class="stat-label">Net worth</span>
        <svg class="spark" width="60" height="20" viewBox="0 0 60 20"><polyline points="0,14 8,12 16,13 24,8 32,9 40,5 48,7 60,3" fill="none" stroke="#16a34a" stroke-width="1.5"/></svg>
      </div>
      <span class="stat-value">$128,402.10</span>
      <div class="row"><span class="stat-delta pos">+$1,540 · +1.2%</span><span class="stat-sub">today</span></div>
    </div>
    <div class="card">
      <div class="row">
        <span class="stat-label">Holdings</span>
      </div>
      <span class="stat-value">14</span>
      <div class="row"><span class="stat-sub">3 accounts · 2 currencies</span></div>
    </div>
    <div class="card">
      <div class="row">
        <span class="stat-label">YTD return</span>
        <svg class="spark" width="60" height="20" viewBox="0 0 60 20"><polyline points="0,16 8,14 16,12 24,13 32,10 40,9 48,7 60,4" fill="none" stroke="#16a34a" stroke-width="1.5"/></svg>
      </div>
      <span class="stat-value">+13.7%</span>
      <div class="row"><span class="stat-delta pos">+$15,402</span><span class="stat-sub">vs cost basis</span></div>
    </div>
  </div>
</body>
</html>
