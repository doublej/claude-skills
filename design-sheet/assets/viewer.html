<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Sheet Viewer</title>
<style>
  :root {
    color-scheme: light dark;
    --chrome-fg: #1a1a1a;
    --chrome-bg: #ffffff;
    --chrome-muted: #6b6b6b;
    --chrome-line: #d8d8d8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --chrome-fg: #e8e8e8; --chrome-bg: #141414; --chrome-muted: #909090; --chrome-line: #333; }
  }
  body {
    margin: 0; padding: 24px;
    background: var(--chrome-bg); color: var(--chrome-fg);
    font: 15px/1.5 system-ui, -apple-system, sans-serif;
  }
  main { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--chrome-muted); margin: 40px 0 12px; font-weight: 600; }
  #drop { border: 1px dashed var(--chrome-line); padding: 20px; text-align: center; margin-bottom: 8px; }
  #drop.over { border-color: var(--chrome-fg); }
  #err { color: #c0392b; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; }
  .theme { padding: 20px; margin-bottom: 16px; border: 1px solid var(--chrome-line); }
  .theme h3 { margin: 0 0 12px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .chip { height: 44px; border: 1px solid currentColor; }
  .tok { font-family: ui-monospace, monospace; font-size: 12px; margin-top: 6px; }
  .val { font-family: ui-monospace, monospace; font-size: 12px; opacity: .7; }
  .intent { font-size: 12px; opacity: .55; }
  .spec { border-bottom: 1px solid var(--chrome-line); padding: 14px 0; }
  .meta { font-family: ui-monospace, monospace; font-size: 12px; color: var(--chrome-muted); margin-bottom: 8px; }
  .line { margin: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { background: currentColor; height: 12px; display: inline-block; vertical-align: middle; opacity: .8; }
  .barrow { margin: 6px 0; font-family: ui-monospace, monospace; font-size: 12px; }
  .barrow span { margin-left: 8px; color: var(--chrome-muted); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
  dt { color: var(--chrome-muted); }
  blockquote { margin: 0; padding-left: 16px; border-left: 3px solid var(--chrome-fg);
               font-size: 19px; line-height: 1.45; }
  pre { background: rgba(128,128,128,.12); padding: 14px; overflow-x: auto;
        font-family: ui-monospace, monospace; font-size: 13px; white-space: pre-wrap; margin: 0; }
  button { font: inherit; font-size: 13px; padding: 4px 10px; margin-top: 8px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Design Sheet Viewer</h1>
  <p style="color:var(--chrome-muted);margin:0 0 16px">Drop, choose, or paste a <code>design-sheet.json</code>.</p>
  <div id="drop">
    <input type="file" id="file" accept=".json,application/json">
  </div>
  <div id="err"></div>
  <div id="out"></div>
</main>
<script>
const $out = document.getElementById('out'), $err = document.getElementById('err'), $drop = document.getElementById('drop');

function h(tag, props, kids) {
  const n = document.createElement(tag);
  Object.assign(n, props || {});
  for (const k of [].concat(kids || [])) n.append(k);
  return n;
}
function section(title, node) {
  $out.append(h('h2', { textContent: title }), node);
}
const find = (tokens, name) => (tokens.find(t => t.token === name) || {}).value;

function render(d) {
  $out.textContent = '';
  $out.append(h('h1', { textContent: 'Design Sheet: ' + (d.name || 'Untitled'), style: 'margin-top:32px' }));

  if (d.typography) {
    const box = h('div');
    for (const t of d.typography) {
      const spec = h('div', { className: 'spec' });
      spec.append(h('div', {
        className: 'meta',
        textContent: [t.role, t.family, (t.weights || []).join(' / '), t.tracking && 'tracking ' + t.tracking]
          .filter(Boolean).join('  ·  ')
      }));
      const weights = t.weights && t.weights.length ? t.weights : [400];
      for (const size of (t.scale && t.scale.length ? t.scale : [16])) {
        spec.append(h('div', {
          className: 'line',
          textContent: 'The quick brown fox — ' + size + 'px',
          style: `font-family:${JSON.stringify(t.family || 'inherit')};font-size:${size}px;` +
                 `font-weight:${weights[0]};letter-spacing:${t.tracking || 'normal'}`
        }));
      }
      if (weights.length > 1) {
        const row = h('div', { style: 'margin-top:8px' });
        for (const w of weights) row.append(h('span', {
          textContent: w + ' ',
          style: `font-family:${JSON.stringify(t.family || 'inherit')};font-weight:${w};font-size:18px;margin-right:14px`
        }));
        spec.append(row);
      }
      box.append(spec);
    }
    section('1. Typography', box);
  }

  if (d.color) {
    const box = h('div');
    for (const [theme, tokens] of Object.entries(d.color)) {
      const bg = find(tokens, 'bg-primary') || '#fff';
      const fg = find(tokens, 'text-base') || '#000';
      const pane = h('div', { className: 'theme', style: `background:${bg};color:${fg}` });
      pane.append(h('h3', { textContent: theme }));
      const grid = h('div', { className: 'swatches' });
      for (const t of tokens) {
        grid.append(h('div', {}, [
          h('div', { className: 'chip', style: `background:${t.value}` }),
          h('div', { className: 'tok', textContent: t.token }),
          h('div', { className: 'val', textContent: t.value }),
          h('div', { className: 'intent', textContent: t.intent || '' })
        ]));
      }
      pane.append(grid);
      box.append(pane);
    }
    section('2. Color', box);
  }

  if (d.spacing) {
    const s = d.spacing, box = h('div');
    if (s.baseUnit != null) box.append(h('div', { className: 'meta', textContent: 'Base unit: ' + s.baseUnit + 'px' }));
    for (const v of s.scale || []) {
      box.append(h('div', { className: 'barrow' }, [
        h('i', { className: 'bar', style: `width:${v}px` }),
        h('span', { textContent: v + 'px' })
      ]));
    }
    if (s.gutter) box.append(h('div', { className: 'meta', textContent: 'Gutter: ' + s.gutter }));
    section('3. Spacing & Rhythm', box);
  }

  if (d.containers) {
    const c = d.containers, box = h('div');
    const radius = /^\d/.test(c.radius || '') ? c.radius : '0';
    const bw = (String(c.borderWidth || '1px').match(/[\d.]+\s*px/) || ['1px'])[0];
    box.append(h('div', {
      textContent: 'Container · max-width ' + (c.maxWidth || 'n/a'),
      style: `border:${bw} solid currentColor;border-radius:${radius};padding:24px;margin-bottom:12px;` +
             `max-width:${c.maxWidth || '100%'}`
    }));
    const dl = h('dl');
    for (const [k, v] of [['Radius', c.radius], ['Border width', c.borderWidth], ['Max-width', c.maxWidth]]) {
      if (v) dl.append(h('dt', { textContent: k }), h('dd', { textContent: v, style: 'margin:0' }));
    }
    box.append(dl);
    section('4. Containers & Borders', box);
  }

  if (d.atmosphere) {
    const dl = h('dl');
    for (const [k, v] of [['Shadows', d.atmosphere.shadows], ['Texture', d.atmosphere.texture], ['Backdrop', d.atmosphere.backdrop]]) {
      if (v) dl.append(h('dt', { textContent: k }), h('dd', { textContent: v, style: 'margin:0' }));
    }
    section('5. Atmosphere & Effects', dl);
  }

  if (d.motif) section('6. Signature Motif', h('blockquote', { textContent: d.motif }));

  if (d.midjourney) {
    const box = h('div');
    box.append(h('pre', { textContent: d.midjourney }));
    const btn = h('button', { textContent: 'Copy prompt' });
    btn.onclick = () => navigator.clipboard.writeText(d.midjourney)
      .then(() => { btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy prompt', 1200); },
            () => { btn.textContent = 'Copy failed'; });
    box.append(btn);
    section('7. Midjourney Baseprompt', box);
  }
}

function load(text) {
  $err.textContent = '';
  let data;
  try { data = JSON.parse(text); }
  catch (e) { $out.textContent = ''; $err.textContent = 'Invalid JSON: ' + e.message; return; }
  if (!data || typeof data !== 'object' || Array.isArray(data)) {
    $out.textContent = ''; $err.textContent = 'Not a design sheet: expected a JSON object.'; return;
  }
  render(data);
}
const readFile = f => f && f.text().then(load);

document.getElementById('file').onchange = e => readFile(e.target.files[0]);
$drop.ondragover = e => { e.preventDefault(); $drop.classList.add('over'); };
$drop.ondragleave = () => $drop.classList.remove('over');
$drop.ondrop = e => { e.preventDefault(); $drop.classList.remove('over'); readFile(e.dataTransfer.files[0]); };
document.addEventListener('paste', e => {
  const t = e.clipboardData.getData('text');
  if (t.trim().startsWith('{')) load(t);
});
</script>
</body>
</html>
