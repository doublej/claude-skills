// ─── PARTICLE SYSTEM ───
class Particle {
  constructor(x, y, color, vx, vy, life, size) {
    this.x = x; this.y = y; this.color = color;
    this.vx = vx; this.vy = vy;
    this.life = this.maxLife = life;
    this.size = size || 2;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vy += 0.02; // gravity
    this.life--;
    return this.life > 0;
  }
  draw(ctx) {
    const a = this.life / this.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
  }
}

let particles = [];
function burst(x, y, color, count, spread) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * spread;
    particles.push(new Particle(x, y, color,
      Math.cos(angle) * speed, Math.sin(angle) * speed - 1,
      40 + Math.random() * 60, 1 + Math.random() * 3
    ));
  }
}

const matrixChars = [];
const matrixSpeeds = Array(COLS).fill(0).map(() => 0.3 + Math.random() * 1.2);

function drawMatrix(t, intensity) {
  ctx.font = '12px "Space Mono", monospace';
  const colW = w / COLS;
  for (let i = 0; i < COLS; i++) {
    matrixDrops[i] += matrixSpeeds[i] * intensity;
    const y = matrixDrops[i] * 14;
    if (y > h + 100) matrixDrops[i] = -Math.random() * 20;
    // Pick a skill name char
    const skill = SKILL_NAMES[i % SKILL_NAMES.length];
    const ch = skill[Math.floor(matrixDrops[i]) % skill.length] || '.';
    // Leading bright char
    ctx.globalAlpha = 0.9 * intensity;
    ctx.fillStyle = '#00FF41';
    ctx.fillText(ch, i * colW, y);
    // Trail
    for (let j = 1; j < 8; j++) {
      ctx.globalAlpha = (0.6 - j * 0.08) * intensity;
      ctx.fillStyle = j < 3 ? '#00FF41' : '#005511';
      const prevCh = skill[(Math.floor(matrixDrops[i]) - j) % skill.length] || '.';
      ctx.fillText(prevCh, i * colW, y - j * 14);
    }
  }
}

// ─── SKILL CARDS ───
let skillCards = [];
class SkillCard {
  constructor(name) {
    this.name = name;
    this.x = w * 0.2 + Math.random() * w * 0.6;
    this.y = h * 0.3 + Math.random() * h * 0.4;
    this.vx = (Math.random() - 0.5) * 8;
    this.vy = (Math.random() - 0.5) * 8;
    this.life = 90 + Math.floor(Math.random() * 40);
    this.rot = (Math.random() - 0.5) * 0.4;
    this.rotV = (Math.random() - 0.5) * 0.03;
    this.scale = 0;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.96;
    this.vy *= 0.96;
    this.rot += this.rotV;
    this.scale = Math.min(1, this.scale + 0.1);
    this.life--;
    return this.life > 0;
  }
  draw(ctx) {
    const a = Math.min(1, this.life / 25);
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.scale(this.scale, this.scale);
    ctx.globalAlpha = a * 0.9;
    ctx.font = 'bold 14px "Space Mono", monospace';
    const tw = ctx.measureText(this.name).width + 28;
    ctx.fillStyle = '#0a0a0aDD';
    ctx.strokeStyle = '#FFD70088';
    ctx.lineWidth = 1;
    ctx.fillRect(-tw/2, -16, tw, 32);
    ctx.strokeRect(-tw/2, -16, tw, 32);
    ctx.fillStyle = '#FFD700';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.name, 0, 0);
    ctx.restore();
  }
}

function spawnSkillCards(count) {
  const shuffled = [...SKILL_NAMES].sort(() => Math.random() - 0.5);
  for (let i = 0; i < Math.min(count, shuffled.length); i++) {
    setTimeout(() => skillCards.push(new SkillCard(shuffled[i])), i * 40);
  }
}

// ─── TERMINAL WINDOW ───
let termLines = [];
let termActive = false;
let termLineIdx = 0;
let termCharIdx = 0;
let termTimer = 0;
let termY = 0;

function activateTerminal() {
  if (termActive) return;
  termActive = true;
  termLines = [];
  termLineIdx = 0;
  termCharIdx = 0;
}

function deactivateTerminal() { termActive = false; }

function updateTerminal() {
  if (!termActive) return;
  termTimer++;
  if (termTimer % 2 === 0 && termLineIdx < TRANSCRIPT.length) {
    termCharIdx++;
    const line = TRANSCRIPT[termLineIdx];
    if (termCharIdx >= line.length) {
      if (termLines.length >= 8) termLines.shift();
      termLines.push(line);
      termLineIdx++;
      termCharIdx = 0;
    }
  }
}

function drawTerminal() {
  if (!termActive && termLines.length === 0) return;
  const tw = Math.min(500, w * 0.4);
  const th = 220;
  const tx = w - tw - 30;
  const ty = h - th - 30;
  ctx.globalAlpha = 0.75;
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(tx, ty, tw, th);
  ctx.strokeStyle = '#00FF4144';
  ctx.lineWidth = 1;
  ctx.strokeRect(tx, ty, tw, th);
  // Title bar
  ctx.fillStyle = '#00FF4122';
  ctx.fillRect(tx, ty, tw, 18);
  ctx.globalAlpha = 0.5;
  ctx.font = '10px "Space Mono", monospace';
  ctx.fillStyle = '#00FF41';
  ctx.fillText('claude-session', tx + 8, ty + 13);
  // Lines
  ctx.font = '11px "Space Mono", monospace';
  ctx.globalAlpha = 0.85;
  const maxChars = Math.floor((tw - 16) / 6.6);
  for (let i = 0; i < termLines.length; i++) {
    const line = termLines[i].substring(0, maxChars);
    ctx.fillStyle = line.startsWith('[AI]') ? '#FFD700' : line.startsWith('✓') ? '#00FF41' : '#00FF41aa';
    ctx.fillText(line, tx + 8, ty + 36 + i * 18);
  }
  // Current typing line
  if (termActive && termLineIdx < TRANSCRIPT.length) {
    const partial = TRANSCRIPT[termLineIdx].substring(0, termCharIdx);
    ctx.fillStyle = '#00FF41';
    ctx.fillText(partial + (Math.floor(Date.now() / 500) % 2 ? '█' : ''), tx + 8, ty + 36 + termLines.length * 18);
  }
}

// ─── GLITCH EFFECT ───
let glitchIntensity = 0;
function triggerGlitch(intensity) { glitchIntensity = intensity; }

function applyGlitch() {
  if (glitchIntensity <= 0) return;
  const imgData = ctx.getImageData(0, 0, w, h);
  for (let i = 0; i < glitchIntensity * 5; i++) {
    const y = Math.floor(Math.random() * h);
    const sliceH = 1 + Math.floor(Math.random() * 5);
    const offset = Math.floor((Math.random() - 0.5) * glitchIntensity * 30);
    const slice = ctx.getImageData(0, y, w, sliceH);
    ctx.putImageData(slice, offset, y);
  }
  // RGB channel shift
  if (glitchIntensity > 5) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.07;
    ctx.drawImage(c, glitchIntensity * 2, 0);
    ctx.drawImage(c, -glitchIntensity * 2, 0);
    ctx.globalCompositeOperation = 'source-over';
  }
  glitchIntensity *= 0.85;
  if (glitchIntensity < 0.5) glitchIntensity = 0;
}

// ─── SCREEN SHAKE ───
let shakeX = 0, shakeY = 0, shakeDecay = 0;
function shake(amount) { shakeDecay = amount; }
function updateShake() {
  if (shakeDecay > 0.5) {
    shakeX = (Math.random() - 0.5) * shakeDecay;
    shakeY = (Math.random() - 0.5) * shakeDecay;
    shakeDecay *= 0.88;
  } else { shakeX = shakeY = 0; }
}

// ─── LYRIC DISPLAY ───
let currentLyric = null;
let lyricAlpha = 0;
let lyricScale = 1;
let lastLyricIdx = -1;
let lyricOffset = 0; // arrow key nudge

function getLyric(t) {
  const adj = t - lyricOffset;
  let idx = -1;
  for (let i = 0; i < LYRICS.length; i++) {
    if (LYRICS[i].t <= adj) idx = i; else break;
  }
  return idx;
}

function drawLyric(t) {
  const idx = getLyric(t);
  if (idx < 0) return;
  if (idx !== lastLyricIdx) {
    lastLyricIdx = idx;
    currentLyric = LYRICS[idx];
    lyricAlpha = 1.2;
    lyricScale = currentLyric.style === 'skills' ? 1.3 : 1.05;
    // Trigger effects for "(SKILLS)" moments
    if (currentLyric.style === 'skills') {
      burst(w/2, h/2, '#FFD700', 60, 6);
      burst(w/2, h/2, '#FFF', 20, 4);
      shake(15);
      triggerGlitch(12);
      spawnSkillCards(6);
    } else if (currentLyric.style === 'hook') {
      burst(w/2, h * 0.45, '#FFD70088', 15, 3);
    }
  }
  if (!currentLyric) return;

  lyricAlpha = Math.min(1, lyricAlpha);
  lyricScale += (1 - lyricScale) * 0.12;

  const l = currentLyric;
  const baseSize = Math.min(w / 14, 60);
  const fontSize = baseSize * l.size;
  ctx.save();
  ctx.translate(w/2, h * 0.45);
  ctx.scale(lyricScale, lyricScale);
  ctx.globalAlpha = lyricAlpha;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (l.style === 'skills') {
    ctx.font = `400 ${fontSize}px 'Bebas Neue', sans-serif`;
    ctx.fillStyle = '#FFD700';
    ctx.shadowColor = '#FFD700';
    ctx.shadowBlur = 40;
    l.txt.split('\n').forEach((line, i) => ctx.fillText(line, 0, i * fontSize * 1.2));
    ctx.shadowBlur = 80;
    ctx.globalAlpha = 0.3;
    l.txt.split('\n').forEach((line, i) => ctx.fillText(line, 0, i * fontSize * 1.2));
  } else if (l.style === 'hook') {
    ctx.font = `700 ${fontSize}px 'Oswald', sans-serif`;
    ctx.fillStyle = '#f5f5f5';
    ctx.shadowColor = '#FFD70044';
    ctx.shadowBlur = 20;
    l.txt.split('\n').forEach((line, i) => ctx.fillText(line, 0, i * fontSize * 1.3));
  } else if (l.style === 'verse') {
    ctx.font = `400 ${fontSize}px 'Space Mono', monospace`;
    ctx.fillStyle = '#cccccc';
    l.txt.split('\n').forEach((line, i) => ctx.fillText(line, 0, i * fontSize * 1.3));
  } else if (l.style === 'scratch') {
    ctx.font = `700 ${fontSize}px 'Oswald', sans-serif`;
    ctx.fillStyle = '#FF4444';
    ctx.shadowColor = '#FF4444';
    ctx.shadowBlur = 25;
    ctx.fillText(l.txt, 0, 0);
  } else if (l.style === 'label') {
    ctx.font = `400 ${fontSize}px 'Space Mono', monospace`;
    ctx.fillStyle = '#555';
    ctx.letterSpacing = '0.3em';
    ctx.fillText(l.txt, 0, 0);
  } else if (l.style === 'outro') {
    ctx.font = `400 ${fontSize}px 'Bebas Neue', sans-serif`;
    ctx.fillStyle = '#FFD700';
    ctx.shadowColor = '#FFD700';
    ctx.shadowBlur = 60;
    ctx.fillText(l.txt, 0, 0);
  }
  ctx.restore();
}

// ─── BEAT DETECTION ───
let nextBeat = BEAT_START;
let beatPulse = 0;

function processBeat(t) {
  if (t >= nextBeat && t > BEAT_START) {
    beatPulse = 1;
    nextBeat = Math.floor(t / BEAT + 1) * BEAT;
    // Subtle burst on beat
    const edge = Math.random() > 0.5;
    if (Math.random() > 0.7) {
      burst(Math.random() * w, edge ? 0 : h, '#FFD70033', 5, 2);
    }
  }
  beatPulse *= 0.88;
}

// ─── SECTION TRIGGERS ───
let lastSection = '';
function processSections(t) {
  const adj = t - lyricOffset;
  // Activate terminal during verses
  if ((adj > 42 && adj < 80) || (adj > 104 && adj < 140) || (adj > 164 && adj < 181)) {
    activateTerminal();
  } else {
    deactivateTerminal();
  }
}

// ─── VIGNETTE ───
function drawVignette() {
  const g = ctx.createRadialGradient(w/2, h/2, w*0.2, w/2, h/2, w*0.75);
  g.addColorStop(0, 'transparent');
  g.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.globalAlpha = 1;
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
}

// ─── SCANLINES ───
function drawScanlines() {
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = '#000';
  for (let y = 0; y < h; y += 3) {
    ctx.fillRect(0, y, w, 1);
  }
}

// ─── PROGRESS BAR ───
function drawProgress(t) {
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#FFD700';
  ctx.fillRect(0, 0, (t / 236) * w, 2);
  ctx.globalAlpha = 0.8;
  ctx.fillRect((t / 236) * w - 2, 0, 2, 4);
}

// ─── BPM INDICATOR ───
function drawBPM(t) {
  ctx.globalAlpha = 0.15 + beatPulse * 0.3;
  ctx.font = '10px "Space Mono", monospace';
  ctx.fillStyle = '#FFD700';
  ctx.textAlign = 'right';
  ctx.fillText(`${BPM} BPM`, w - 16, h - 16);
  if (lyricOffset !== 0) {
    ctx.fillText(`offset: ${lyricOffset.toFixed(1)}s`, w - 16, h - 30);
  }
}

// ─── SYNC / MARKER SYSTEM ───
let markers = [];
let syncHUD = false;
const SECTION_NAMES = ['Intro','Scratch','Hook 1','Verse 1','Hook 2','Verse 2','Hook 3','Verse 3','Hook 4','Outro'];

function addMarker(t, label) {
  markers.push({ t: t.toFixed(2), label: label || `marker ${markers.length + 1}` });
  console.log(`%c[MARKER] ${t.toFixed(2)}s — ${label || ''}`, 'color: #FFD700; font-weight: bold');
}

function drawSyncHUD(t) {
  if (!syncHUD) return;
  ctx.save();
  ctx.globalAlpha = 0.9;
  // Time display - big
  ctx.font = '700 28px "Oswald", sans-serif';
  ctx.fillStyle = '#FFD700';
  ctx.textAlign = 'left';
  ctx.fillText(t.toFixed(2) + 's', 20, 40);
  // Current lyric info
  const idx = getLyric(t);
  if (idx >= 0) {
    ctx.font = '12px "Space Mono", monospace';
    ctx.fillStyle = '#00FF41';
    ctx.fillText(`lyric #${idx}/${LYRICS.length} — "${LYRICS[idx].txt}"`, 20, 62);
  }
  // Keys help
  ctx.font = '10px "Space Mono", monospace';
  ctx.fillStyle = '#555';
  ctx.fillText('T=mark  C=copy  D=hud  ←→=nudge  1-9=section', 20, h - 8);
  // Markers on progress bar
  for (const m of markers) {
    const mx = (parseFloat(m.t) / 236) * w;
    ctx.fillStyle = '#FF4444';
    ctx.fillRect(mx - 1, 0, 2, 8);
    ctx.font = '8px "Space Mono", monospace';
    ctx.fillStyle = '#FF4444';
    ctx.textAlign = 'center';
    ctx.fillText(m.label, mx, 18);
  }
  // Marker list (last 6)
  const recent = markers.slice(-6);
  ctx.textAlign = 'left';
  ctx.font = '10px "Space Mono", monospace';
  for (let i = 0; i < recent.length; i++) {
    ctx.fillStyle = '#FF444488';
    ctx.fillText(`${recent[i].t}s  ${recent[i].label}`, 20, 82 + i * 14);
  }
  ctx.restore();
}

// ─── MAIN LOOP ───
let started = false;

function frame() {
  if (!started) { requestAnimationFrame(frame); return; }
  const t = now();

  ctx.save();
  updateShake();
  ctx.translate(shakeX, shakeY);

  // Clear
  ctx.globalAlpha = 0.15; // motion trail
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);

  // Beat
  processBeat(t);
  processSections(t);
  updateTerminal();

  // Beat pulse bg flash
  if (beatPulse > 0.5 && t > BEAT_START) {
    ctx.globalAlpha = beatPulse * 0.04;
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(0, 0, w, h);
  }

  // Matrix rain (subtle during verses, intense during hooks)
  const adj = t - lyricOffset;
  const isHook = LYRICS.some(l => l.style === 'skills' && Math.abs(adj - l.t) < 3);
  drawMatrix(t, isHook ? 0.8 : 0.25);

  // Skill cards
  skillCards = skillCards.filter(c => { c.update(); c.draw(ctx); return true; });
  skillCards = skillCards.filter(c => c.life > 0);

  // Particles
  ctx.globalAlpha = 1;
  particles = particles.filter(p => { if (p.update()) { p.draw(ctx); return true; } return false; });

  // Lyrics
  drawLyric(t);

  // Terminal overlay
  ctx.font = '11px "Space Mono", monospace';
  drawTerminal();

  // Post effects
  drawVignette();
  drawScanlines();
  applyGlitch();
  drawProgress(t);
  drawBPM(t);
  drawSyncHUD(t);

  ctx.restore();
  requestAnimationFrame(frame);
}

function boot() {
  document.getElementById('start').style.display = 'none';
  started = true;
  if (ytReady) ytp.playVideo();
  requestAnimationFrame(frame);
}

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); boot(); }
  // Offset nudge
  if (e.code === 'ArrowRight') { lyricOffset -= 0.5; lastLyricIdx = -1; }
  if (e.code === 'ArrowLeft') { lyricOffset += 0.5; lastLyricIdx = -1; }
  // Sync tools
  if (e.key === 'd' || e.key === 'D') { syncHUD = !syncHUD; }
  if (e.key === 't' || e.key === 'T') {
    const t = now();
    addMarker(t);
  }
  // Number keys = named section markers
  if (e.key >= '1' && e.key <= '9') {
    const t = now();
    const name = SECTION_NAMES[parseInt(e.key) - 1] || `section ${e.key}`;
    addMarker(t, name);
  }
  // Copy markers to clipboard
  if (e.key === 'c' || e.key === 'C') {
    const data = markers.map(m => `${m.t}s  ${m.label}`).join('\n');
    navigator.clipboard.writeText(data).then(() => {
      console.log('%c[SYNC] Markers copied to clipboard', 'color: #00FF41');
    });
  }
});

requestAnimationFrame(frame);
</script>
