<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 28px; background: #f4f4f5; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 96px; height: 56px; border-radius: 10px; background: #fff; }
  .name { font-size: 11px; color: var(--color-fg-2); font-weight: 500; }
  .val { font-family: var(--font-mono); font-size: 10px; color: var(--color-muted); text-align: center; }
  .note { margin-top: 14px; font-size: 11px; color: var(--color-muted); text-align: center; }
</style>
</head>
<body>
  <div class="grid">
    <div class="item">
      <div class="box" style="box-shadow: 0 1px 0 rgba(10,10,10,0.04);"></div>
      <span class="name">xs</span><span class="val">borders, chips</span>
    </div>
    <div class="item">
      <div class="box" style="box-shadow: 0 1px 2px rgba(10,10,10,0.06), 0 1px 1px rgba(10,10,10,0.04);"></div>
      <span class="name">sm</span><span class="val">popovers</span>
    </div>
    <div class="item">
      <div class="box" style="box-shadow: 0 4px 12px rgba(10,10,10,0.06), 0 2px 4px rgba(10,10,10,0.04);"></div>
      <span class="name">md</span><span class="val">dropdowns, toasts</span>
    </div>
    <div class="item">
      <div class="box" style="box-shadow: 0 12px 32px rgba(10,10,10,0.10), 0 4px 8px rgba(10,10,10,0.04);"></div>
      <span class="name">lg</span><span class="val">cmd-K palette</span>
    </div>
  </div>
  <div class="note">Body chrome uses borders, not shadows. Shadows are for floating elements only.</div>
</body>
</html>
