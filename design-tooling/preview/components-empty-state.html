<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: var(--color-card); border: 0.5px solid var(--color-border); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
  .card .ico { width: 32px; height: 32px; color: var(--color-muted); }
  .card h3 { font-size: 14px; font-weight: 600; }
  .card p { font-size: 12px; color: var(--color-muted); line-height: 1.5; max-width: 240px; }
  .btn-primary { margin-top: 4px; height: 30px; padding: 0 14px; background: var(--color-accent); color: var(--color-accent-fg); border: 0; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn-link { font-size: 12px; font-weight: 500; color: var(--color-accent); text-decoration: none; margin-top: 4px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3h18v18H3z"/><path d="M3 9h18M9 9v12"/></svg>
      <h3>No transactions</h3>
      <p>Connect an account to see activity here.</p>
      <button class="btn-primary"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg> Connect account</button>
    </div>
    <div class="card">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>
      <h3>No alerts</h3>
      <p>You're all caught up.</p>
      <a class="btn-link" href="#">Configure alerts →</a>
    </div>
  </div>
</body>
</html>
