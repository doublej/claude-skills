<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 0; background: #f4f4f5; }
  .stage { position: relative; height: 220px; overflow: hidden; }
  .col { position: absolute; top: 0; bottom: 0; width: var(--col-max, 1100px); max-width: 100%; left: 50%; transform: translateX(-50%); background: #fff; border-left: 0.5px solid rgba(94,106,210,0.3); border-right: 0.5px solid rgba(94,106,210,0.3); }
  .col::before, .col::after { content: ""; position: absolute; top: 0; bottom: 0; width: 24px; background: repeating-linear-gradient(45deg, rgba(94,106,210,0.08) 0 4px, transparent 4px 8px); }
  .col::before { left: 0; }
  .col::after  { right: 0; }
  .nav { position: absolute; top: 0; left: 0; right: 0; height: 44px; background: #fff; border-bottom: 0.5px solid var(--color-border); display: flex; align-items: center; padding: 0 16px; font-size: 12px; color: var(--color-muted); }
  .lbl { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); font-family: var(--font-mono); font-size: 11px; color: var(--color-muted); background: #fff; padding: 4px 8px; border: 0.5px solid var(--color-border); border-radius: 4px; }
  .bnav { position: absolute; bottom: 0; left: 0; right: 0; height: 52px; background: #fff; border-top: 0.5px solid var(--color-border); display: flex; justify-content: space-around; align-items: center; font-size: 10px; color: var(--color-muted); }
  .bnav span { padding: 4px 8px; }
  .body-area { position: absolute; top: 56px; bottom: 64px; left: 24px; right: 24px; display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; }
  .body-area > div { background: rgba(94,106,210,0.06); border-radius: 4px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="col">
      <div class="nav">Sticky TopNav · 56px</div>
      <div class="body-area">
        <div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div>
      </div>
      <div class="bnav"><span>Home</span><span>Markets</span><span>Holdings</span><span>Activity</span><span>More</span></div>
      <div class="lbl">max-w 1100px · 12-col / 24px gutter · 24px page padding</div>
    </div>
  </div>
</body>
</html>
